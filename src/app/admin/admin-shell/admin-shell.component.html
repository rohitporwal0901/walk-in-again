<div class="admin-layout" [class.sidebar-collapsed]="!sidebarOpen()">

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <!-- Logo -->
    <div class="sidebar-logo">
      <div class="logo-icon-sm">🏥</div>
      @if (sidebarOpen()) {
        <div class="sidebar-logo-text animate-fade-in">
          <span class="logo-t1">Walk In Again</span>
          <span class="logo-t2">PHYSIOTHERAPY</span>
        </div>
      }
    </div>

    <!-- Nav Items -->
    <nav class="sidebar-nav">
      @for (item of navItems; track item.id) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="sidebar-item"
          [id]="item.id"
          [title]="item.label"
        >
          <span class="si-icon">{{ item.icon }}</span>
          @if (sidebarOpen()) {
            <span class="si-label animate-fade-in">{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <!-- Logout -->
    <button class="sidebar-logout" (click)="openLogoutConfirm()" id="admin-logout">
      <span class="si-icon">🚪</span>
      @if (sidebarOpen()) {
        <span class="si-label animate-fade-in">Logout</span>
      }
    </button>
  </aside>

  <!-- Main Area -->
  <div class="admin-main">
    <!-- Topbar -->
    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" (click)="toggleSidebar()" id="sidebar-toggle">☰</button>
        <div class="topbar-search">
          <span>🔍</span>
          <input
            type="search"
            placeholder="Search patients, workers..."
            id="admin-search"
            [value]="searchQuery()"
            (input)="searchQuery.set($any($event.target).value)"
          />
        </div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="admin-notifications">🔔</button>
        <div class="admin-user-chip">
          <div class="admin-av">A</div>
          <span>Admin</span>
          <span>▾</span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="admin-content page-scroll">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Logout Confirmation Modal -->
  @if (showLogoutConfirm()) {
    <div class="logout-modal-backdrop" (click)="closeLogoutConfirm()">
      <div class="logout-modal-card" (click)="$event.stopPropagation()">
        <div class="modal-icon-bubble">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </div>

        <h3 class="modal-title">Sign Out</h3>
        <p class="modal-desc">Are you sure you want to log out of the Administrator portal?</p>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" (click)="closeLogoutConfirm()" id="admin-logout-cancel">
            Cancel
          </button>
          <button type="button" class="btn-confirm-logout" (click)="confirmLogout()" id="admin-logout-confirm">
            Yes, Sign Out
          </button>
        </div>
      </div>
    </div>
  }
</div>
